# One domain for everything: the website at /, the API at /api.
# provision.sh fills in DOMAIN, BACKEND and FRONTEND, and certbot adds https.
server {
    listen 80;
    server_name __DOMAIN__;

    # The built frontend.
    root __FRONTEND__/dist;
    index index.html;

    # The app accepts PDFs up to 150 MB. A lower limit here gives a confusing
    # error before Laravel ever sees the file.
    client_max_body_size 160M;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Never serve hidden files such as .env or .git.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # The API and the health check go to Laravel. Only public/index.php can run,
    # so nothing else in the backend folder can be reached from the web.
    location ~ ^/(api|up)(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME __BACKEND__/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT __BACKEND__/public;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        # Watermarking a large thesis or importing a long list can take a while.
        fastcgi_read_timeout 300;
    }

    # Covers, avatars and the landing image.
    location ^~ /storage/ {
        alias __BACKEND__/public/storage/;
        expires 7d;
    }

    # Built files have a content hash in their name, so they can be kept long.
    # Nginx drops headers set higher up once a location adds its own, so the
    # security headers are in each location that serves the website.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Every other path belongs to the React app.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri /index.html;
    }
}
