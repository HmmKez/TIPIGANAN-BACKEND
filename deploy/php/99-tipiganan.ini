; Limits for TIPIGANAN. PHP's defaults (2M uploads, 128M memory) reject large scans.
upload_max_filesize = 160M
post_max_size = 160M
; Watermarking needs about twice the file's size: a 135 MB scan peaked at 290 MB.
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
; Faster, but PHP keeps old code until reloaded, which update.sh does.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
expose_php = Off
