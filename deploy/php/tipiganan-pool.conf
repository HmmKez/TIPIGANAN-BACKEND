; Added to PHP-FPM's www pool. Each large PDF view can use up to 512 MB, so this
; keeps a 2 GB server from running out of memory. Raise it on a bigger server.
[www]
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
request_terminate_timeout = 300
